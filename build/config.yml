version: '3'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - frontend
      - bin
      - .local
      - samples
    file:
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.sql'
    git_ignore: true
  executes:
    - cmd: wails3 task build:dev
      type: blocking
    - cmd: wails3 task frontend:dev
      type: background
      readiness:
        http: http://127.0.0.1:9245/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run:dev
      type: primary
      exit_policy: shutdown
